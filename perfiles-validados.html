<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=32&h=32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proceso de Selección | Casas Fiscales - Ejército Nacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    spacing: { '13': '3.25rem', '21': '5.25rem', '34': '8.5rem' }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" defer></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" defer></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <style>
        body { font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect } = React;

        function App() {
            useEffect(() => {
                if (window.lucide?.createIcons) window.lucide.createIcons();
            }, []);

            return (
                <div className="min-h-screen bg-slate-50">
                    {/* Barra de Navegación */}
                    <header className="bg-[#2B3A24] text-white shadow-lg border-b-4 border-[#D4AF37] sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-5 md:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-4">
                                <div className="w-11 h-11 bg-white rounded-full flex items-center justify-center p-1 shadow-inner text-[#2B3A24]">
                                    <i data-lucide="shield-check" className="w-7 h-7"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-wide uppercase">Ejército Nacional de Colombia</h1>
                                    <p className="text-[#D4AF37] font-medium tracking-widest text-xs">Casas Fiscales - Contratación Oficial</p>
                                </div>
                            </div>
                            <nav className="flex flex-wrap gap-3 text-sm font-medium">
                                <a href="index.html" className="hover:text-[#D4AF37] transition-colors">Inicio</a>
                                <a href="convocatoria.html" className="hover:text-[#D4AF37] transition-colors">Convocatoria</a>
                                <a href="requisitos.html" className="hover:text-[#D4AF37] transition-colors">Requisitos</a>
                                <a href="proceso-seleccion.html" className="text-[#D4AF37] font-semibold">Proceso</a>
                                <a href="consulta-tramite.html" className="hover:text-[#D4AF37] transition-colors">Consulta Trámite</a>
                                <a href="perfiles-validados.html" className="hover:text-[#D4AF37] transition-colors">Perfiles</a>
                                <a href="contacto.html" className="hover:text-[#D4AF37] transition-colors">Contacto</a>
                            </nav>
                        </div>
                    </header>

                    {/* Contenido Central */}
                    <main className="max-w-5xl mx-auto px-5 md:px-8 py-10">
                        <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
                            <h2 className="text-3xl font-extrabold text-[#2B3A24] border-b-2 border-[#D4AF37] pb-3 mb-6">ETAPAS DEL PROCESO DE SELECCIÓN</h2>
                            <p className="text-slate-600 mb-8 leading-relaxed">Proceso ordenado, transparente y seguro. Podrás consultar el estado en cualquier momento en la sección correspondiente:</p>

                            <div className="space-y-5">
                                {[
                                    {paso: "1", titulo: "Recepción de Documentos", desc: "Entrega o envío de toda la documentación requerida. Se asigna número de radicado."},
                                    {paso: "2", titulo: "Verificación de Antecedentes", desc: "Comprobación oficial de referencias y antecedentes penales, disciplinarios y judiciales."},
                                    {paso: "3", titulo: "Evaluación y Entrevista", desc: "Valoración de experiencia, vocación y conocimientos necesarios para el cargo."},
                                    {paso: "4", titulo: "Aprobación Final", desc: "Lista de aspirantes seleccionadas y notificación oficial."},
                                    {paso: "5", titulo: "Vinculación y Capacitación", desc: "Formalización del contrato y capacitación en protocolos institucionales."}
                                ].map((item, i) => (
                                    <div key={i} className="flex gap-4 items-start">
                                        <div className="flex-shrink-0 w-10 h-10 rounded-full bg-[#2B3A24] text-white flex items-center justify-center font-bold text-lg">{item.paso}</div>
                                        <div className="pb-5 border-b border-slate-100 w-full">
                                            <h3 className="text-lg font-bold text-[#2B3A24]">{item.titulo}</h3>
                                            <p className="text-slate-600 mt-1">{item.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="mt-10 flex flex-wrap gap-4">
                                <a href="requisitos.html" className="px-6 py-3 bg-slate-600 text-white rounded-lg font-medium hover:bg-slate-700 transition-all">Ver Requisitos</a>
                                <a href="consulta-tramite.html" className="px-6 py-3 bg-[#2B3A24] text-white rounded-lg font-medium hover:bg-[#1f291c] transition-all">Consultar mi Trámite</a>
                            </div>
                        </div>
                    </main>

                    {/* Pie de Página */}
                    <footer className="bg-[#2B3A24] text-white py-6 mt-10">
                        <div className="max-w-7xl mx-auto px-5 text-center text-sm">
                            <p>© 2026 Casas Fiscales - Ejército Nacional de Colombia | Todos los derechos reservados</p>
                            <p className="mt-2">🔗 Sitio oficial: casasfiscales-ejercito-nacional.netlify.app</p>
                            <p className="mt-2 text-amber-300 italic">⚠️ ADVERTENCIA: No se cobra dinero por ningún trámite o etapa del proceso.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
