<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=32&h=32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfiles Validados | Casas Fiscales - Ejército Nacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    spacing: { '13': '3.25rem', '21': '5.25rem', '34': '8.5rem' }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" defer></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" defer></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <style>
        body { font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect } = React;

        function App() {
            useEffect(() => {
                if (window.lucide?.createIcons) window.lucide.createIcons();
            }, []);

            return (
                <div className="min-h-screen bg-slate-50">
                    {/* Barra de Navegación */}
                    <header className="bg-[#2B3A24] text-white shadow-lg border-b-4 border-[#D4AF37] sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-5 md:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-4">
                                <div className="w-11 h-11 bg-white rounded-full flex items-center justify-center p-1 shadow-inner text-[#2B3A24]">
                                    <i data-lucide="shield-check" className="w-7 h-7"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-wide uppercase">Ejército Nacional de Colombia</h1>
                                    <p className="text-[#D4AF37] font-medium tracking-widest text-xs">Casas Fiscales - Contratación Oficial</p>
                                </div>
                            </div>
                            <nav className="flex flex-wrap gap-3 text-sm font-medium">
                                <a href="index.html" className="hover:text-[#D4AF37] transition-colors">Inicio</a>
                                <a href="convocatoria.html" className="hover:text-[#D4AF37] transition-colors">Convocatoria</a>
                                <a href="requisitos.html" className="hover:text-[#D4AF37] transition-colors">Requisitos</a>
                                <a href="proceso-seleccion.html" className="hover:text-[#D4AF37] transition-colors">Proceso</a>
                                <a href="consulta-tramite.html" className="hover:text-[#D4AF37] transition-colors">Consulta Trámite</a>
                                <a href="perfiles-validados.html" className="text-[#D4AF37] font-semibold">Perfiles</a>
                                <a href="contacto.html" className="hover:text-[#D4AF37] transition-colors">Contacto</a>
                            </nav>
                        </div>
                    </header>

                    {/* Contenido Central */}
                    <main className="max-w-7xl mx-auto px-5 md:px-8 py-10">
                        <div className="mb-8">
                            <h2 className="text-3xl font-extrabold text-[#2B3A24] border-b-2 border-[#D4AF37] pb-3">PERFILES VALIDADOS Y CERTIFICADOS</h2>
                            <p className="text-slate-600 mt-3">Ejemplos de personal que ha superado todos los filtros y hace parte de nuestra institución. Su compromiso es nuestra garantía:</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {[
                                {nombre:"Ana Milena Rojas", ubicacion:"Casa Fiscal - Cantón Norte", exp:"7 años", nivel:"Nivel 1 - Aprobado Alto Nivel", color:"bg-emerald-100 text-emerald-800", img:"https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=180&h=180"},
                                {nombre:"Diana Patricia Vélez", ubicacion:"Casa Fiscal - Puente Aranda", exp:"4 años", nivel:"Nivel 2 - Verificado", color:"bg-blue-100 text-blue-800", img:"https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&q=80&w=180&h=180"},
                                {nombre:"Carmen Alicia Torres", ubicacion:"Casa Fiscal - Cantón Sur", exp:"12 años", nivel:"Nivel 1 - Aprobado Alto Nivel", color:"bg-emerald-100 text-emerald-800", img:"https://images.unsplash.com/photo-1607746882042-944635dfe10e?auto=format&fit=crop&q=80&w=180&h=180"}
                            ].map((p, i) => (
                                <div key={i} className="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden hover:shadow-lg transition-shadow">
                                    <div className="h-40 bg-[#2B3A24] flex items-center justify-center">
                                        <img src={p.img} alt={p.nombre} className="w-28 h-28 rounded-full object-cover border-4 border-white shadow-md" loading="lazy"/>
                                    </div>
                                    <div className="p-6 text-center">
                                        <h3 className="text-xl font-bold text-[#2B3A24]">{p.nombre}</h3>
                                        <p className="text-sm text-slate-500 mt-1">{p.ubicacion}</p>
                                        <p className="text-sm font-medium mt-2">Experiencia: {p.exp}</p>
                                        <span className={`inline-block mt-3 px-3 py-1 rounded-full text-xs font-semibold ${p.color}`}>{p.nivel}</span>
                                        <p className="mt-4 text-xs text-slate-600 italic">✅ Personal vinculado y certificado por la institución</p>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="mt-10 text-center">
                            <a href="index.html" className="inline-block px-6 py-3 bg-[#2B3A24] text-white rounded-lg font-medium hover:bg-[#1f291c] transition-all">Volver al Inicio</a>
                        </div>
                    </main>

                    {/* Pie de Página */}
                    <footer className="bg-[#2B3A24] text-white py-6 mt-10">
                        <div className="max-w-7xl mx-auto px-5 text-center text-sm">
                            <p>© 2026 Casas Fiscales - Ejército Nacional de Colombia | Todos los derechos reservados</p>
                            <p className="mt-2">🔗 Sitio oficial: casasfiscales-ejercito-nacional.netlify.app</p>
                            <p className="mt-2 text-amber-300 italic">⚠️ ADVERTENCIA: No se cobra dinero por ningún trámite o etapa del proceso.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
